name: Auto-Commit Agent Work

# Manual trigger — run an AI agent on a task and auto-commit the result.
#
# Required repository secrets:
#   PAT_TOKEN       — GitHub Personal Access Token (for push permissions)
#   OPENAI_API_KEY  — your OpenAI API key
#
# Usage: Actions tab → "Auto-Commit Agent Work" → Run workflow → enter task

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task description for the agent"
        required: true
        type: string
      model:
        description: "LLM model to use"
        required: false
        default: "gpt-4o"
        type: choice
        options:
          - gpt-4o
          - gpt-4o-mini
          - claude-sonnet-4-20250514
      files:
        description: "Files to operate on (space-separated, e.g. backend/server.py web/src/app/page.tsx)"
        required: false
        default: "backend/server.py"
        type: string

jobs:
  agent-work:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Aider
        run: pip install aider-chat

      - name: Configure Git Identity
        run: |
          git config user.name "ai-agent"
          git config user.email "agent@polymath-os.dev"

      - name: Create Agent Branch
        run: |
          BRANCH="agent/task-$(date +%s)"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Run Aider Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          aider --yes --auto-commits \
            --model "${{ inputs.model }}" \
            --message "${{ inputs.task }}" \
            ${{ inputs.files }}

      - name: Push Branch
        run: git push origin "${{ env.BRANCH }}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ env.BRANCH }}
          title: "🤖 Agent: ${{ inputs.task }}"
          body: |
            ## Auto-generated by AI Agent

            **Task:** ${{ inputs.task }}
            **Model:** ${{ inputs.model }}
            **Files:** ${{ inputs.files }}

            ---
            _Review carefully before merging._
