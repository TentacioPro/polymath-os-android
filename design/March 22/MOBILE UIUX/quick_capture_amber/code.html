<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "outline": "#9e8e78",
              "error-container": "#93000a",
              "surface-container-highest": "#353534",
              "on-tertiary-container": "#5b4e23",
              "on-tertiary": "#3a3007",
              "on-surface-variant": "#d6c4ac",
              "error": "#ffb4ab",
              "surface-dim": "#131313",
              "on-secondary-fixed-variant": "#474746",
              "on-background": "#e5e2e1",
              "surface-container": "#201f1f",
              "secondary-fixed-dim": "#c8c6c5",
              "on-secondary": "#303030",
              "on-tertiary-fixed-variant": "#52461c",
              "on-surface": "#e5e2e1",
              "tertiary": "#efdda5",
              "surface-container-high": "#2a2a2a",
              "on-error": "#690005",
              "tertiary-fixed": "#f4e2a9",
              "surface-container-lowest": "#0e0e0e",
              "on-tertiary-fixed": "#231b00",
              "on-secondary-container": "#b7b5b4",
              "on-primary-fixed": "#281900",
              "surface-tint": "#ffba38",
              "primary-container": "#ffb300",
              "tertiary-fixed-dim": "#d7c690",
              "surface-bright": "#393939",
              "primary": "#ffd79b",
              "on-primary-container": "#6b4900",
              "on-secondary-fixed": "#1b1c1c",
              "surface-container-low": "#1c1b1b",
              "on-primary": "#432c00",
              "background": "#131313",
              "tertiary-container": "#d2c18b",
              "on-error-container": "#ffdad6",
              "inverse-on-surface": "#313030",
              "secondary-container": "#474746",
              "secondary": "#c8c6c5",
              "primary-fixed": "#ffdeac",
              "outline-variant": "#514532",
              "inverse-surface": "#e5e2e1",
              "surface": "#131313",
              "surface-variant": "#353534",
              "secondary-fixed": "#e4e2e1",
              "inverse-primary": "#7e5700",
              "primary-fixed-dim": "#ffba38",
              "on-primary-fixed-variant": "#604100"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Space Grotesk"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem", "2xl": "1.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(19, 19, 19, 0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(81, 69, 50, 0.2);
        }
        .amber-glow {
            box-shadow: 0 -10px 40px -10px rgba(255, 186, 56, 0.15);
        }
        .tap-target {
            min-height: 44px;
            min-width: 44px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#0A0A0A] text-on-surface font-body overflow-hidden h-screen w-screen flex flex-col justify-end">
<!-- Header / Background Visuals (The Archive Canvas) -->
<header class="bg-[#131313] fixed top-0 w-full z-50 flex items-center justify-between px-6 h-16 w-full max-w-none border-none">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#ffd79b]" data-icon="terminal">terminal</span>
<h1 class="font-['Space_Grotesk'] tracking-[0.1em] uppercase headline-sm text-xl font-bold text-[#ffd79b]">POLYMATH OS</h1>
</div>
<button class="tap-target flex items-center justify-center hover:scale-105 transition-transform duration-200">
<span class="material-symbols-outlined text-[#ffd79b]" data-icon="search">search</span>
</button>
</header>
<!-- Main Content Simulation (Behind Bottom Sheet) -->
<main class="p-6 pt-24 space-y-8 flex-1 overflow-y-auto">
<section class="space-y-4">
<div class="h-48 w-full bg-surface-container-low rounded-xl flex flex-col items-center justify-center p-8 text-center border-none">
<span class="material-symbols-outlined text-outline-variant text-4xl mb-4" data-icon="database">database</span>
<p class="font-label text-xs uppercase tracking-widest text-outline-variant">Neural Archive Synced</p>
<p class="text-on-surface-variant body-md mt-2">Ready for incoming cognitive data stream...</p>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="h-32 bg-surface-container-high rounded-lg p-4 flex flex-col justify-end border-none">
<p class="font-label text-[10px] uppercase text-primary mb-1">Last Update</p>
<p class="font-headline font-bold text-lg leading-tight">System Core v4.2</p>
</div>
<div class="h-32 bg-surface-container-high rounded-lg p-4 flex flex-col justify-end border-none">
<p class="font-label text-[10px] uppercase text-primary mb-1">Storage</p>
<p class="font-headline font-bold text-lg leading-tight">84% Capacity</p>
</div>
</div>
</section>
</main>
<!-- Quick Capture Bottom Sheet -->
<div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[60]"></div>
<section class="glass-panel amber-glow z-[70] rounded-t-2xl px-6 pt-3 pb-10 w-full max-w-2xl mx-auto">
<!-- Drag Handle -->
<div class="flex justify-center mb-6">
<div class="w-12 h-1 bg-outline-variant/30 rounded-full"></div>
</div>
<!-- Header -->
<div class="mb-8 text-center">
<h2 class="font-headline text-2xl font-bold tracking-tight text-primary">QUICK CAPTURE</h2>
<p class="font-label text-[10px] uppercase tracking-[0.2em] text-on-surface-variant/60 mt-1">Select Input Protocol</p>
</div>
<!-- Bento Grid: 2x2 Action Modes -->
<div class="grid grid-cols-2 gap-4">
<!-- Voice Mode -->
<button class="tap-target group relative flex flex-col items-start justify-between p-6 bg-surface-container-high hover:bg-surface-container-highest transition-all duration-200 rounded-xl overflow-hidden active:scale-95">
<div class="absolute top-0 right-0 p-3 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="mic">mic</span>
</div>
<span class="material-symbols-outlined text-primary mb-6" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
<div class="text-left">
<p class="font-headline font-bold text-on-surface">Voice</p>
<p class="font-label text-[10px] uppercase text-on-surface-variant/60">Audio Transcription</p>
</div>
</button>
<!-- Link Mode -->
<button class="tap-target group relative flex flex-col items-start justify-between p-6 bg-surface-container-high hover:bg-surface-container-highest transition-all duration-200 rounded-xl overflow-hidden active:scale-95">
<div class="absolute top-0 right-0 p-3 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="link">link</span>
</div>
<span class="material-symbols-outlined text-primary mb-6" data-icon="link">link</span>
<div class="text-left">
<p class="font-headline font-bold text-on-surface">Link</p>
<p class="font-label text-[10px] uppercase text-on-surface-variant/60">Web Intelligence</p>
</div>
</button>
<!-- Scan Mode -->
<button class="tap-target group relative flex flex-col items-start justify-between p-6 bg-surface-container-high hover:bg-surface-container-highest transition-all duration-200 rounded-xl overflow-hidden active:scale-95">
<div class="absolute top-0 right-0 p-3 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="camera">camera</span>
</div>
<span class="material-symbols-outlined text-primary mb-6" data-icon="camera">camera</span>
<div class="text-left">
<p class="font-headline font-bold text-on-surface">Scan</p>
<p class="font-label text-[10px] uppercase text-on-surface-variant/60">Visual Analysis</p>
</div>
</button>
<!-- File Mode -->
<button class="tap-target group relative flex flex-col items-start justify-between p-6 bg-surface-container-high hover:bg-surface-container-highest transition-all duration-200 rounded-xl overflow-hidden active:scale-95">
<div class="absolute top-0 right-0 p-3 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="description">description</span>
</div>
<span class="material-symbols-outlined text-primary mb-6" data-icon="description">description</span>
<div class="text-left">
<p class="font-headline font-bold text-on-surface">File</p>
<p class="font-label text-[10px] uppercase text-on-surface-variant/60">Document Import</p>
</div>
</button>
</div>
<!-- Footer Actions -->
<div class="mt-8 flex items-center justify-between">
<button class="tap-target px-4 py-2 text-on-surface-variant font-label text-xs uppercase hover:text-primary transition-colors">
                Cancel
            </button>
<div class="flex gap-2">
<button class="tap-target h-10 w-10 flex items-center justify-center bg-surface-container-low rounded-full hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined text-on-surface-variant text-lg" data-icon="settings">settings</span>
</button>
</div>
</div>
</section>
<!-- Bottom Nav Bar (Suppressed on focused sheets but modeled here for hierarchy) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 pb-6 bg-[#131313]/60 backdrop-blur-xl border-t border-[#514532]/10 z-40">
<div class="flex flex-col items-center justify-center text-[#e5e2e1]/40 transition-colors">
<span class="material-symbols-outlined" data-icon="add_box">add_box</span>
<span class="font-['Space_Grotesk'] text-[10px] tracking-widest uppercase mt-1">CAPTURE</span>
</div>
<div class="flex flex-col items-center justify-center text-[#e5e2e1]/40 transition-colors">
<span class="material-symbols-outlined" data-icon="database">database</span>
<span class="font-['Space_Grotesk'] text-[10px] tracking-widest uppercase mt-1">ARCHIVE</span>
</div>
<div class="flex flex-col items-center justify-center text-[#e5e2e1]/40 transition-colors">
<span class="material-symbols-outlined" data-icon="psychology">psychology</span>
<span class="font-['Space_Grotesk'] text-[10px] tracking-widest uppercase mt-1">NEURAL</span>
</div>
<div class="flex flex-col items-center justify-center text-[#e5e2e1]/40 transition-colors">
<span class="material-symbols-outlined" data-icon="settings_input_component">settings_input_component</span>
<span class="font-['Space_Grotesk'] text-[10px] tracking-widest uppercase mt-1">OS</span>
</div>
</nav>
</body></html>
