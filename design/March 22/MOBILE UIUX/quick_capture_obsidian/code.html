<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Polymath OS - Quick Capture</title>

        tailwind.config = {

                "on-secondary-container": "#e2e2e2",

                "background": "#000000",
                "on-primary": "#1a1c1c",
                "surface-container-low": "#1b1b1b",
                "on-secondary-fixed": "#1b1b1b",
                "on-primary-container": "#000000",
                "primary": "#ffffff",
                "tertiary-fixed-dim": "#474747",
                "surface-bright": "#393939",
                "outline-variant": "#474747",
                "secondary-container": "#474747",
                "secondary": "#c6c6c6",
                "primary-fixed": "#5d5e5f",
                "inverse-on-surface": "#303030",
                "tertiary-container": "#919191",
                "on-error-container": "#ffdad6",
                "primary-fixed-dim": "#464747",
                "on-primary-fixed-variant": "#e3e2e2",
                "inverse-primary": "#5d5e5f",
                "surface-variant": "#353535",
                "secondary-fixed": "#c6c6c6",
                "surface": "#131313",
                "inverse-surface": "#e2e2e2",
                "error-container": "#93000a",
                "outline": "#919191",
                "surface-dim": "#131313",
                "on-secondary-fixed-variant": "#3b3b3b",
                "error": "#ffb4ab",
                "on-tertiary-container": "#000000",
                "on-tertiary": "#1b1b1b",
                "on-surface-variant": "#c6c6c6",
                "surface-container-highest": "#353535",
                "on-tertiary-fixed-variant": "#e2e2e2",
                "secondary-fixed-dim": "#ababab",
                "on-secondary": "#1b1b1b",
                "surface-container": "#1f1f1f",
                "on-background": "#e2e2e2",
                "surface-container-high": "#2a2a2a",
                "tertiary": "#e2e2e2",
                "on-surface": "#e2e2e2"
              },
              fontFamily: {
                "headline": ["Space Grotesk"],
                "body": ["Inter"],
                "label": ["Space Grotesk"]
              },
              borderRadius: {
                "DEFAULT": "0.125rem",
                "lg": "0.25rem",
                "xl": "0.5rem",
                "2xl": "1.75rem",
                "full": "0.75rem"
              },
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .bento-glow:hover {
            background-color: #393939;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body min-h-screen flex flex-col overflow-hidden">
<!-- Top App Bar -->
<header class="bg-[#131313] flex justify-between items-center w-full px-6 h-16 fixed top-0 z-40">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#ffffff] cursor-pointer" data-icon="menu">menu</span>
<h1 class="font-['Space_Grotesk'] tracking-[-0.02em] font-bold text-2xl text-[#ffffff]">Polymath OS</h1>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#ffffff] cursor-pointer p-2 hover:bg-[#393939] rounded-sm transition-colors duration-200" data-icon="search">search</span>
</div>
</header>
<!-- Main Content Canvas (Mock Dashboard) -->
<main class="flex-1 pt-20 px-6 pb-24 overflow-y-auto">
<div class="max-w-md mx-auto space-y-8">
<!-- Learning Engine Pulse -->
<div class="w-full h-0.5 bg-surface-container overflow-hidden rounded-full">
<div class="h-full w-1/3 bg-gradient-to-r from-secondary to-primary"></div>
</div>
<!-- Dashboard Content -->
<section>
<h2 class="font-headline text-3xl font-bold tracking-tight mb-6">Sovereign Intel</h2>
<div class="grid grid-cols-1 gap-4">
<div class="bg-surface-container-low p-7 rounded-lg min-h-[160px] flex flex-col justify-end">
<span class="text-secondary font-label text-[0.6875rem] uppercase tracking-[0.1rem] mb-2">Neural Synthesis</span>
<p class="text-on-surface-variant text-lg leading-snug">The concept of "Machined Obsidian" is ready for expansion. 4 new nodes found.</p>
</div>
<div class="bg-surface-container-low p-7 rounded-lg min-h-[120px] flex flex-col justify-end">
<span class="text-secondary font-label text-[0.6875rem] uppercase tracking-[0.1rem] mb-2">Active Streams</span>
<div class="flex gap-2">
<div class="h-1 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary w-2/3"></div>
</div>
</div>
</div>
</div>
</section>
<section class="opacity-40 select-none">
<h2 class="font-headline text-xl font-bold tracking-tight mb-4">Recent Archives</h2>
<div class="space-y-4">
<div class="h-16 bg-surface-container-low rounded-lg w-full"></div>
<div class="h-16 bg-surface-container-low rounded-lg w-full"></div>
</div>
</section>
</div>
</main>
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-background/80 backdrop-blur-md z-40"></div>
<!-- Quick Capture Bottom Sheet -->
<section class="fixed bottom-0 left-0 w-full z-50 bg-surface-container-highest rounded-t-2xl shadow-none border-none">
<!-- Drag Handle -->
<div class="w-full flex justify-center py-4">
<div class="w-12 h-1 bg-outline-variant rounded-full opacity-40"></div>
</div>
<div class="max-w-md mx-auto px-6 pb-12 pt-2">
<header class="mb-8">
<h3 class="font-headline text-2xl font-bold text-primary tracking-tight">Quick Capture</h3>
<p class="font-label text-[0.6875rem] text-secondary uppercase tracking-[0.1rem] mt-1">Instant ingestion engine</p>
</header>
<!-- 2x2 Bento Grid -->
<div class="grid grid-cols-2 gap-4">
<!-- Action Mode: Voice -->
<button class="bg-surface-container-high bento-glow min-h-[140px] p-6 flex flex-col justify-between items-start text-left transition-all duration-150 active:scale-95 rounded-xl group min-w-[44px]">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="mic">mic</span>
<span class="font-headline font-semibold text-lg text-on-surface leading-none">Voice</span>
</button>
<!-- Action Mode: Link -->
<button class="bg-surface-container-high bento-glow min-h-[140px] p-6 flex flex-col justify-between items-start text-left transition-all duration-150 active:scale-95 rounded-xl group min-w-[44px]">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="link">link</span>
<span class="font-headline font-semibold text-lg text-on-surface leading-none">Link</span>
</button>
<!-- Action Mode: Scan -->
<button class="bg-surface-container-high bento-glow min-h-[140px] p-6 flex flex-col justify-between items-start text-left transition-all duration-150 active:scale-95 rounded-xl group min-w-[44px]">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="camera">camera</span>
<span class="font-headline font-semibold text-lg text-on-surface leading-none">Scan</span>
</button>
<!-- Action Mode: File -->
<button class="bg-surface-container-high bento-glow min-h-[140px] p-6 flex flex-col justify-between items-start text-left transition-all duration-150 active:scale-95 rounded-xl group min-w-[44px]">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="description">description</span>
<span class="font-headline font-semibold text-lg text-on-surface leading-none">File</span>
</button>
</div>
<div class="mt-10 flex justify-center">
<button class="text-secondary font-label text-[0.6875rem] uppercase tracking-[0.2rem] py-3 px-8 hover:text-primary transition-colors min-w-[44px] min-h-[44px]">
                    Dismiss
                </button>
</div>
</div>
</section>
<!-- Bottom Nav Bar (Hidden by Sheet but part of shell structure) -->
<nav class="fixed bottom-0 left-0 w-full z-30 bg-[#131313] flex justify-around items-center px-4 py-2 opacity-20 pointer-events-none">
<div class="flex flex-col items-center justify-center text-[#c6c6c6] p-3">
<span class="material-symbols-outlined" data-icon="bolt">bolt</span>
</div>
<div class="flex flex-col items-center justify-center text-[#c6c6c6] p-3">
<span class="material-symbols-outlined" data-icon="database">database</span>
</div>
<div class="flex flex-col items-center justify-center text-[#c6c6c6] p-3">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
</div>
<div class="flex flex-col items-center justify-center text-[#c6c6c6] p-3">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</div>
</nav>
